# Installed to /etc/nginx/conf.d/image2genre.conf
#
# default_server is required. Amazon Linux's stock nginx.conf carries its own
# server block on port 80; without this keyword that block wins and every
# request gets the nginx 404 page instead of the app.
server {
    # Both stacks. Amazon Linux's stock server block binds listen [::]:80 as
    # well as IPv4, and `curl localhost` resolves to ::1 first on this distro --
    # so declaring only IPv4 leaves IPv6 requests hitting the nginx welcome
    # page while the app looks broken.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Phone photos are large and the upload is multipart.
    client_max_body_size 25M;

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /static/ {
        alias /opt/image2genre/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
